apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spring-service.name" . }}
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # 새 파드가 readiness를 통과해야 옛 파드가 내려간다
  selector:
    matchLabels:
      {{- include "spring-service.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spring-service.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "spring-service.name" . }}
      securityContext:
        runAsNonRoot: true
      # 같은 서비스 파드를 다른 AZ의 노드에 나눠 띄운다. 노드가 2대뿐이라 못 맞추면 그냥 띄운다
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "spring-service.selector" . | nindent 14 }}
      containers:
        - name: app
          image: {{ include "spring-service.image" . }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $k, $v := .Values.cluster.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: SERVER_PORT
              value: "8080"
            {{- with .Values.observability }}
            {{- if .jsonLogs }}
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE   # JSON 한 줄 로그(traceId·spanId 포함)
              value: ecs
            {{- end }}
            # 응답 시간 p95를 구하려고 요청 시간 히스토그램을 내보낸다
            - name: MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS
              value: "true"
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: {{ .samplingProbability | quote }}
            - name: MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENABLED
              value: {{ .tracing | toString | quote }}
            {{- if .tracing }}
            - name: MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT
              value: {{ .zipkinEndpoint | quote }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # 비밀이 아직 동기화되지 않았으면 파드는 Secret이 생길 때까지 기다렸다가 뜬다(optional로 두면 키 없이 떠 버린다)
          {{- if or .Values.db.secretName .Values.toss.secretName .Values.extraSecrets }}
          envFrom:
            {{- if .Values.db.secretName }}
            - secretRef:
                name: {{ include "spring-service.name" . }}-db
            {{- end }}
            {{- if .Values.toss.secretName }}
            - secretRef:
                name: {{ include "spring-service.name" . }}-toss
            {{- end }}
            {{- range .Values.extraSecrets }}
            - secretRef:
                name: {{ include "spring-service.name" $ }}-{{ .name }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
