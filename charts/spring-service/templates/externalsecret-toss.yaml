{{- if .Values.toss.secretName }}
# Secrets Manager의 토스 키 비밀(JSON clientKey·secretKey)에서 secretKey만 꺼내 Kubernetes Secret으로 만든다.
# clientKey는 가져오지 않는다(프론트 빌드용). 비밀값은 이 레포·로그에 쓰지 않는다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "spring-service.name" . }}-toss
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ include "spring-service.name" . }}-toss
  data:
    - secretKey: TOSS_SECRET_KEY
      remoteRef:
        key: {{ .Values.toss.secretName }}
        property: secretKey
{{- end }}
