{{- range $s := .Values.extraSecrets }}
---
# Secrets Manager 비밀(JSON)에서 env에 적은 키만 꺼내 Kubernetes Secret <서비스>-<name>으로 만든다(values.yaml extraSecrets).
# 비밀값은 이 레포·로그에 쓰지 않는다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "spring-service.name" $ }}-{{ required "extraSecrets[].name이 필요하다" $s.name }}
  labels:
    {{- include "spring-service.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ include "spring-service.name" $ }}-{{ $s.name }}
  data:
    {{- range $envName, $property := required "extraSecrets[].env가 필요하다" $s.env }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: {{ required "extraSecrets[].secretName이 필요하다" $s.secretName }}
        property: {{ $property }}
    {{- end }}
{{- end }}
