{{- if .Values.db.secretName }}
# Secrets Manager의 앱 DB 비밀(JSON host·port·dbname·username·password)을 Kubernetes Secret으로 만든다.
# 비밀값은 이 레포에 쓰지 않는다. ClusterSecretStore는 argocd/apps 차트가 만든다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "spring-service.name" . }}-db
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ include "spring-service.name" . }}-db
    template:
      engineVersion: v2
      data:
        DB_URL: {{ `"jdbc:mysql://{{ .host }}:{{ .port }}/{{ .dbname }}"` }}
        DB_USERNAME: {{ `"{{ .username }}"` }}
        DB_PASSWORD: {{ `"{{ .password }}"` }}
  dataFrom:
    - extract:
        key: {{ .Values.db.secretName }}
{{- end }}
