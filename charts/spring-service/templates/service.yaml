# 서비스끼리는 이 이름으로 부른다 (예 http://member-service:8080)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spring-service.name" . }}
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "spring-service.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
