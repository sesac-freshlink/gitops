# 이름 = 레포 이름. IRSA Role(freshlink-<env>-<레포>-irsa)이 이 이름만 믿는다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spring-service.name" . }}
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . }}
  {{- end }}
