# 공통 기본값. 서비스·환경별 값은 envs/<env>/<서비스>/values.yaml에 둔다(키 구조는 dev·prod 같다).
# cluster.* 와 serviceAccount.roleArn은 ArgoCD(argocd/apps 차트)가 넣는다. 값의 출처는 infra cluster 묶음(Terraform 출력)이다.

replicaCount: 1

image:
  name: ""   # 비우면 릴리스 이름(= 레포 이름 = ECR 리포지토리)
  tag: ""    # git 커밋 7자리. CI가 커밋한다. latest 금지

# CPU 상한은 두지 않는다(기동할 때 노드의 남는 CPU를 빌려 쓴다). README 8장
resources:
  requests:
    cpu: 150m
    memory: 512Mi
  limits:
    memory: 768Mi

# 서비스 환경 변수. SERVER_PORT는 차트가 8080으로 넣는다
env: {}

# 앱 DB 비밀(Secrets Manager 이름). 비우면 DB를 쓰지 않는 서비스. 값은 DB_URL·DB_USERNAME·DB_PASSWORD로 들어간다
db:
  secretName: ""

# 토스 키 비밀(Secrets Manager 이름, JSON clientKey·secretKey). order-service만 켠다. 비우면 토스 키 없음
# secretKey만 TOSS_SECRET_KEY로 들어간다. clientKey는 프론트 빌드용이라 파드에 넣지 않는다
toss:
  secretName: ""

# 그 밖의 비밀(Secrets Manager JSON)에서 키 몇 개를 골라 환경 변수로 넣는다. 항목마다 ExternalSecret 하나(<서비스>-<name>)
# 예) gateway BFF: bff 클라이언트 시크릿 → COGNITO_CLIENT_SECRET
#   extraSecrets:
#     - name: cognito                                  # Kubernetes Secret 이름 gateway-cognito
#       secretName: freshlink-dev/gateway/cognito      # Secrets Manager 이름
#       env:
#         COGNITO_CLIENT_SECRET: clientSecret          # 환경 변수: JSON 키
# ESO가 읽을 수 있는 비밀만 된다(infra envs/<env>/cluster external-secrets 정책에 ARN이 있어야 한다)
extraSecrets: []

# gateway만 켠다. ALB(target-type ip)가 /api 를 이 서비스로 넘긴다
ingress:
  enabled: false
  allowedPrefixLists: []   # 비우면 ALB가 인터넷 전체(0.0.0.0/0)에서 받는다. CloudFront 오리진용 목록 ID를 넣으면 CloudFront만 받는다

serviceAccount:
  roleArn: ""   # IRSA Role ARN. 비우면 annotation 없음. 값은 infra root(cluster.irsaRoleArns)가 넣는다(gitops는 공개라 계정 값을 적지 않는다)

# 관측성(할 일 16). argocd/apps 차트가 환경마다 넣는다. 서비스 레포에는 의존성(spring-boot-starter-zipkin)만 있으면 된다
observability:
  jsonLogs: true      # stdout에 JSON 한 줄(ECS). Alloy가 읽어 Loki로 보낸다
  tracing: false      # true면 Zipkin으로 추적을 보낸다(관측성이 켜진 환경만)
  zipkinEndpoint: http://zipkin.observability:9411/api/v2/spans
  samplingProbability: "1.0"   # MVP는 요청이 적어 전부 기록

cluster:
  imageRegistry: ""   # <계정>.dkr.ecr.ap-northeast-2.amazonaws.com
  env: {}             # 모든 서비스에 넣는 값 (AWS_REGION, COGNITO_*)

probes:
  readiness:
    initialDelaySeconds: 20
    periodSeconds: 10
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 90   # 기동 중인 파드를 죽었다고 보고 재시작하지 않게 readiness보다 늦게
    periodSeconds: 20
    failureThreshold: 3
