# Grafana Alloy 값 (dev·prod 같다). 노드마다 파드 1개(데몬셋)가 자기 노드의 파드 로그 파일을 읽어 Loki로 보낸다.
# 서비스 코드는 Loki를 모른다. 서비스는 stdout에 JSON 한 줄(ECS 형식)로 찍기만 한다.
controller:
  type: daemonset
  priorityClassName: freshlink-observability

alloy:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  mounts:
    varlog: true   # 노드의 /var/log/pods
  configMap:
    create: true
    content: |
      // 1. 이 노드에 뜬 파드 목록 (HOSTNAME = 노드 이름, 차트가 spec.nodeName으로 넣는다)
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // 2. Loki 라벨은 적게: namespace, app, container, pod. traceId는 라벨로 만들지 않는다(종류가 폭발한다)
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // 3. 컨테이너 런타임(CRI) 머리말을 떼고, Spring JSON 로그면 log.level을 level 라벨로 올린다(JSON이 아닌 줄은 그대로 보낸다)
      loki.process "pods" {
        stage.cri {}
        stage.json {
          expressions = { level = "log.level" }   // ECS 형식: {"log":{"level":"INFO",...}}
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability:3100/loki/api/v1/push"
        }
      }
