apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.24.0 # TODO: 설치 직전에 최신 버전으로 고정
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2026-10-01"
                store: tsdb
                object_store: s3
                schema: v13
                index: { prefix: loki_index_, period: 24h }
          storage:
            type: s3
            bucketNames:
              chunks: freshlink-loki-logs # TODO: infra에서 만든 버킷 이름으로 바꾸기
              ruler: freshlink-loki-logs
            s3:
              region: ap-northeast-2
          limits_config:
            retention_period: 336h # 14일 (S3 수명 주기와 맞춤)
          compactor:
            retention_enabled: true
            delete_request_store: s3
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::<계정ID>:role/freshlink-loki-irsa # TODO
        singleBinary:
          replicas: 1
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
        # 기본으로 켜지는 것들. 끄지 않으면 메모리 수 GiB를 요청해 노드 2대에 들어가지 않는다
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        lokiCanary: { enabled: false }
        gateway: { enabled: false }
        test: { enabled: false }
        backend: { replicas: 0 }
        read: { replicas: 0 }
        write: { replicas: 0 }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
