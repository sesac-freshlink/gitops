# 메모리 저장. 파드가 재시작하면 추적 기록이 사라진다 (MVP는 당일 확인용)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  labels: { app.kubernetes.io/name: zipkin }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: zipkin }
  template:
    metadata:
      labels: { app.kubernetes.io/name: zipkin }
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3 # TODO: 설치 직전에 정확한 버전으로 고정
          ports:
            - containerPort: 9411
          env:
            - name: STORAGE_TYPE
              value: mem
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=75
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /health, port: 9411 }
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
spec:
  selector: { app.kubernetes.io/name: zipkin }
  ports:
    - port: 9411
      targetPort: 9411
