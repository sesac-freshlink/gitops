# order-service (prod). 키 구조는 envs/dev/order-service/values.yaml과 같고 값만 다르다.
replicaCount: 1   # 점주 매출 SSE: 연결된 파드에만 이벤트가 가서 1개로 둔다. 늘릴 때는 Redis Pub/Sub을 먼저 붙인다 (기술스택 3-8)

image:
  tag: "6ded476"   # CI가 커밋한다 (chore(order-service): image <7자리>). 손으로 고치지 않는다

resources:
  requests:
    cpu: 150m
    memory: 512Mi
  limits:
    memory: 768Mi

env:
  SPRING_PROFILES_ACTIVE: prod
  QUEUE_PREFIX: prod-
  # 시뮬레이터 주문 결제 완료 POST /ops/orders/{id}/simulated-payment (3차 할 일 1-3, 토스 없음, /ops라 밖에서 못 부른다)
  SIMULATED_PAYMENT_ENABLED: "true"

db:
  secretName: "freshlink-prod-order-db"

# 토스 시크릿 키 → TOSS_SECRET_KEY. 값은 infra scripts/set-toss-key.ps1 -Env prod로 넣는다(값이 없으면 파드가 뜨지 않고 기다린다)
toss:
  secretName: "freshlink-prod-toss"

# 선착순 대기열 Valkey 주소 → REDIS_HOST·REDIS_PORT (TLS). 비밀은 infra cluster 묶음(modules/cache)이 클러스터와 같이 만든다.
# 비밀이 없으면 파드가 뜨지 않고 기다리므로, infra PR이 합쳐지고 클러스터를 다시 만든 뒤에 이 값을 넣는다(infra README 4-19)
extraSecrets:
  - name: redis
    secretName: "freshlink-prod/order/redis"
    env:
      REDIS_HOST: host
      REDIS_PORT: port

ingress:
  enabled: false
