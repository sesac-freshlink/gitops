# logistics-simulator (dev). 키 구조는 envs/prod/logistics-simulator/values.yaml과 같고 값만 다르다.
replicaCount: 1

image:
  tag: "cd01d54"   # CI가 커밋한다 (chore(logistics-simulator): image <7자리>). 손으로 고치지 않는다

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

env:
  SPRING_PROFILES_ACTIVE: dev
  QUEUE_PREFIX: dev-
  # 매일 시나리오 (3차 할 일 1-2·1-4, logistics-simulator README 5-1). dev는 평일 아침 입고만, 주문은 꺼 둔다
  # (팀원 시험 데이터와 섞이지 않게. 시험할 때만 SIMULATOR_ORDERS_ENABLED를 "true"로 바꾸는 PR)
  # 2026-11-23 시연이 끝나 dev 매일 시나리오를 끈다 (dev 예약 모두 없앰. prod는 그대로)
  SIMULATOR_SCHEDULE_ENABLED: "false"
  SIMULATOR_INBOUND_CRON: "0 20 9 * * MON-FRI"
  SIMULATOR_ORDERS_ENABLED: "false"
  SIMULATOR_ORDERS_PER_STORE_MIN: "2"
  SIMULATOR_ORDERS_PER_STORE_MAX: "3"
  SIMULATOR_STORES: "1,2,3,4"
  # 11/17 태우님 요청: 팀원이 화면을 시험하며 사 가도 비지 않게 목표 수량 4배, 매일 내일 마감(기한 1일) lot 3개를 더 넣어
  # 마감세일이 늘 있게 한다. 신상품 P031–P036은 11/18 아침 입고부터 점포마다 6개 모두(첫 입고 7일 = 신상품 배지).
  # 상품 행(infra scripts/seed/dev-inventory.sql)을 먼저 넣어야 한다. 없는 상품이 섞이면 그 점포 입고가 통째로 실패한다
  SIMULATOR_INBOUND_SCALE: "4"
  SIMULATOR_CLEARANCE_LOTS: "3"
  SIMULATOR_LAUNCH_FROM: "2026-11-18"
  SIMULATOR_LAUNCH_TO: "2026-11-18"
  SIMULATOR_LAUNCH_RECENT_MIN: "6"
  SIMULATOR_LAUNCH_RECENT_MAX: "6"

db:
  secretName: ""

# 가상 고객 sub·단골 점포 → SIMULATOR_CUSTOMERS. 비밀은 infra persistent 묶음이 만들고 scripts/seed-cognito.ps1 -Env dev가 값을 넣는다.
# 값이 없으면 파드가 뜨지 않고 기다리므로 시드를 먼저 돌린다(infra README 4-12)
extraSecrets:
  - name: customers
    secretName: "freshlink-dev/simulator/customers"
    env:
      SIMULATOR_CUSTOMERS: customers

ingress:
  enabled: false
