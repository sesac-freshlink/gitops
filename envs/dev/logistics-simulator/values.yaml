# logistics-simulator (dev). 키 구조는 envs/prod/logistics-simulator/values.yaml과 같고 값만 다르다.
replicaCount: 1

image:
  tag: "3395324"   # CI가 커밋한다 (chore(logistics-simulator): image <7자리>). 손으로 고치지 않는다

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

env:
  SPRING_PROFILES_ACTIVE: dev
  QUEUE_PREFIX: dev-

db:
  secretName: ""

ingress:
  enabled: false
