# inventory-service (dev). 키 구조는 envs/prod/inventory-service/values.yaml과 같고 값만 다르다.
replicaCount: 2

image:
  tag: "bbdbb13"   # CI가 커밋한다 (chore(inventory-service): image <7자리>). 손으로 고치지 않는다

resources:
  requests:
    cpu: 150m
    memory: 640Mi
  limits:
    memory: 1Gi

env:
  SPRING_PROFILES_ACTIVE: dev
  QUEUE_PREFIX: dev-
  EXPIRY_CRON: "0 0 * * * *"   # 유통기한 상태 갱신·알림을 매시 정각에. 기본값(자정)은 클러스터가 꺼져 있어 돌지 않는다. 시연 때는 "0 * * * * *"(매분)

db:
  secretName: "freshlink-dev-inventory-db"

ingress:
  enabled: false
