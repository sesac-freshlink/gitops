# order-service (dev). 키 구조는 envs/prod/order-service/values.yaml과 같고 값만 다르다.
replicaCount: 2

image:
  tag: "27e40ea"   # CI가 커밋한다 (chore(order-service): image <7자리>). 손으로 고치지 않는다

resources:
  requests:
    cpu: 150m
    memory: 512Mi
  limits:
    memory: 768Mi

env:
  SPRING_PROFILES_ACTIVE: dev
  QUEUE_PREFIX: dev-

db:
  secretName: "freshlink-dev-order-db"

# 토스 시크릿 키 → TOSS_SECRET_KEY. 값은 infra scripts/set-toss-key.ps1로 넣는다(값이 없으면 파드가 뜨지 않고 기다린다)
toss:
  secretName: "freshlink-dev-toss"

# 선착순 대기열 Valkey 주소 → REDIS_HOST·REDIS_PORT (TLS). 비밀은 infra cluster 묶음(modules/cache)이 클러스터와 같이 만든다.
# 비밀이 없으면 파드가 뜨지 않고 기다리므로, infra PR이 합쳐지고 클러스터를 다시 만든 뒤에 이 값을 넣는다(infra README 4-19)
extraSecrets:
  - name: redis
    secretName: "freshlink-dev/order/redis"
    env:
      REDIS_HOST: host
      REDIS_PORT: port

ingress:
  enabled: false
