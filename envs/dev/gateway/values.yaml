# gateway (dev). 키 구조는 envs/prod/gateway/values.yaml과 같고 값만 다르다.
replicaCount: 2

image:
  tag: "00970e6"   # CI가 커밋한다 (chore(gateway): image <7자리>). 손으로 고치지 않는다

resources:
  requests:
    cpu: 150m
    memory: 512Mi
  limits:
    memory: 768Mi

env:
  SPRING_PROFILES_ACTIVE: dev

db:
  secretName: ""

# BFF(10/28): bff 클라이언트 시크릿 → COGNITO_CLIENT_SECRET. 비밀은 infra envs/dev/persistent가 만든다.
# IRSA(AdminInitiateAuth) Role 주석은 infra root가 serviceAccount.roleArn으로 넣는다(freshlink-dev-gateway-irsa)
extraSecrets:
  - name: cognito
    secretName: "freshlink-dev/gateway/cognito"
    env:
      COGNITO_CLIENT_SECRET: clientSecret

ingress:
  enabled: true
  # CloudFront 오리진용 관리형 접두사 목록(com.amazonaws.global.cloudfront.origin-facing, ap-northeast-2). 계정 값이 아니라 리전 공통 ID
  allowedPrefixLists:
    - pl-22a6434b
