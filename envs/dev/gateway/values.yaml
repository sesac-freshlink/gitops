# gateway (dev). 키 구조는 envs/prod/gateway/values.yaml과 같고 값만 다르다.
replicaCount: 2

image:
  tag: "89c4aee"   # CI가 커밋한다 (chore(gateway): image <7자리>). 손으로 고치지 않는다

resources:
  requests:
    cpu: 150m
    memory: 512Mi
  limits:
    memory: 768Mi

env:
  SPRING_PROFILES_ACTIVE: dev

db:
  secretName: ""

ingress:
  enabled: true
  # CloudFront 오리진용 관리형 접두사 목록(com.amazonaws.global.cloudfront.origin-facing, ap-northeast-2). 계정 값이 아니라 리전 공통 ID
  allowedPrefixLists:
    - pl-22a6434b
