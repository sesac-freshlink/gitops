# env, gitops, cluster는 root Application(infra charts/argocd-root)이 넣는다. 여기는 키 모양과 서비스 목록만 둔다.
env: ""   # dev | prod → envs/<env>/<서비스>/values.yaml
gitops:
  repoURL: https://github.com/sesac-freshlink/gitops.git
  revision: main
cluster:
  imageRegistry: ""
  irsaRoleArns: {}
  env: {}

# 앱 네임스페이스(dev·prod 같다)
namespace: freshlink

# 서비스 = 레포 = ECR = Helm 릴리스 = Application 이름. 새 서비스는 여기에 한 줄 더한다(README 9장)
services:
  - gateway
  - member-service
  - inventory-service
  - order-service
  - logistics-simulator
  - notification-service   # 화면 알림(10/30)

# 아직 그 환경에 이미지가 없는 서비스. Application을 만들지 않는다(태그가 비어 있으면 차트가 실패한다).
# 첫 release(main 승격)로 CI가 envs/prod/<서비스>/values.yaml에 태그를 넣은 뒤 이 목록에서 지운다
notYetDeployed:
  dev: []
  prod:
    - notification-service

# 관측성 스택(platform/observability, 할 일 16). 환경마다 켠다. dev 확인을 마치고 prod도 켰다(10/28 release).
# 켜면 서비스 파드에도 Zipkin 주소가 들어간다(꺼진 환경에서는 서비스가 추적을 보내지 않는다).
# 환경마다 다른 값(Loki S3 버킷, Loki IRSA Role ARN)은 root가 cluster.observability로 넘긴다.
observability:
  enabled:
    dev: true
    prod: true
  namespace: observability
  # 외부 Helm 차트 버전 고정. 올릴 때는 PR로 한 개씩 올리고 dev에서 확인한다
  charts:
    kube-prometheus-stack:
      repoURL: https://prometheus-community.github.io/helm-charts
      version: 92.10.1
    loki:
      repoURL: https://grafana.github.io/helm-charts
      version: 7.3.0
    alloy:
      repoURL: https://grafana.github.io/helm-charts
      version: 1.13.1
  zipkinEndpoint: http://zipkin.observability:9411/api/v2/spans
