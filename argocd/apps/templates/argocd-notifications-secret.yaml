{{- /*
ArgoCD 알림(동기화 실패·Health Degraded·Missing → Discord 오류 채널)이 쓰는 웹훅 주소.
알림 설정(트리거·메시지)은 infra envs/<env>/cluster/helm.tf의 ArgoCD 차트 값에 있고, 주소만 여기서 Secret으로 넣는다.
주소는 이 레포(공개)에 쓰지 않는다. Secrets Manager 비밀(JSON url) 이름을 root가 cluster.notifications.webhookSecretName으로 넘긴다.
값이 없는 환경(알림을 켜지 않은 클러스터)에는 만들지 않는다.
*/ -}}
{{- with dig "notifications" "webhookSecretName" "" .Values.cluster }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: argocd-notifications-secret   # ArgoCD 알림 컨트롤러가 읽는 이름(바꾸지 않는다)
    creationPolicy: Owner
  data:
    - secretKey: discord-webhook-url    # infra helm.tf 알림 설정의 $discord-webhook-url
      remoteRef:
        key: {{ . }}
        property: url
{{- end }}
