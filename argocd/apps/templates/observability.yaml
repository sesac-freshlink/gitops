{{- /*
관측성 스택(할 일 16). observability.enabled.<env>가 true인 환경에만 만든다.
- observability-base: 우선순위 클래스, Zipkin, Grafana 대시보드 (platform/observability/manifests)
- kube-prometheus-stack, loki, alloy: 외부 Helm 차트 + 이 레포의 값 파일(platform/observability/values/<차트>.yaml)
환경마다 다른 값은 cluster.observability(root가 infra Terraform 출력으로 넘긴다)에서 받는다.
*/ -}}
{{- if index .Values.observability.enabled (required "env가 필요하다" .Values.env) }}
{{- $o := .Values.observability }}
{{- /* infra가 아직 값을 넘기지 않은 클러스터(apply 전)에서도 서비스 앱까지 깨지지 않게, 값이 없으면 loki만 건너뛴다 */ -}}
{{- $loki := dig "observability" "loki" dict .Values.cluster }}
{{- /* Grafana CloudWatch용 IRSA Role. 값이 없으면 주석만 빠지고 CloudWatch 화면이 권한 오류를 낸다(나머지는 그대로) */ -}}
{{- $grafana := dig "observability" "grafana" dict .Values.cluster }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-base
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # 우선순위 클래스가 다른 관측성 파드보다 먼저 있어야 한다
spec:
  project: default
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.revision }}
    path: platform/observability/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $o.namespace }}
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
{{- range $name := list "kube-prometheus-stack" "loki" "alloy" }}
{{- if or (ne $name "loki") $loki.bucket }}
{{- $chart := index $o.charts $name }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  project: default
  sources:
    - repoURL: {{ $chart.repoURL }}
      chart: {{ $name }}
      targetRevision: {{ $chart.version | quote }}
      helm:
        releaseName: {{ $name }}
        valueFiles:
          - $values/platform/observability/values/{{ $name }}.yaml
        {{- if eq $name "loki" }}
        valuesObject:
          loki:
            storage:
              bucketNames:
                chunks: {{ $loki.bucket | quote }}
                ruler: {{ $loki.bucket | quote }}
                admin: {{ $loki.bucket | quote }}
              s3:
                region: {{ $.Values.cluster.env.AWS_REGION | default "ap-northeast-2" | quote }}
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: {{ required "cluster.observability.loki.roleArn이 필요하다" $loki.roleArn | quote }}
        {{- else if eq $name "kube-prometheus-stack" }}
        valuesObject:
          # AWS 대시보드가 dev·prod를 가르는 값. dev·prod가 한 AWS 계정이라 큐·RDS·ALB·CloudFront를 env로 거른다
          additionalPrometheusRulesMap:
            freshlink-env:
              groups:
                - name: freshlink-env
                  rules:
                    - record: freshlink_env_info
                      expr: vector(1)
                      labels:
                        env: {{ $.Values.env | quote }}
          {{- with $grafana.roleArn }}
          grafana:
            serviceAccount:
              annotations:
                eks.amazonaws.com/role-arn: {{ . | quote }}
            # 서비스 계정 주석만 바뀌면 파드가 다시 뜨지 않아 Role을 못 받는다. Role이 바뀌면 파드를 다시 띄운다
            podAnnotations:
              freshlink/aws-role: {{ . | sha256sum | trunc 8 | quote }}
          {{- end }}
        {{- end }}
    - repoURL: {{ $.Values.gitops.repoURL }}
      targetRevision: {{ $.Values.gitops.revision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $o.namespace }}
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      {{- if eq $name "kube-prometheus-stack" }}
      - ServerSideApply=true   # Prometheus Operator CRD가 커서 일반 apply의 annotation 크기 제한에 걸린다
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
