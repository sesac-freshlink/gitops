{{- range .Values.services }}
---
# 서비스 하나 = 공용 차트 charts/spring-service + envs/<env>/<서비스>/values.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
spec:
  project: default
  source:
    repoURL: {{ $.Values.gitops.repoURL }}
    targetRevision: {{ $.Values.gitops.revision }}
    path: charts/spring-service
    helm:
      releaseName: {{ . }}
      valueFiles:
        - ../../envs/{{ required "env가 필요하다" $.Values.env }}/{{ . }}/values.yaml
      valuesObject:
        cluster:
          imageRegistry: {{ $.Values.cluster.imageRegistry | quote }}
          env:
            {{- toYaml $.Values.cluster.env | nindent 12 }}
        serviceAccount:
          roleArn: {{ index $.Values.cluster.irsaRoleArns . | default "" | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $.Values.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
