# 서비스 차트의 ExternalSecret이 읽는 곳. 인증 설정을 따로 두지 않으면 External Secrets Operator 컨트롤러의 IRSA Role로 읽는다.
# 그 Role은 앱 DB 비밀 3개와 토스 키만 읽을 수 있다(infra envs/<env>/cluster).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.cluster.env.AWS_REGION | default "ap-northeast-2" }}
